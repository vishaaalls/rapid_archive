name: rapid_archive
description: Drop-in fast gzip, zlib and zip for Dart and Flutter, powered by Rust.
version: 0.2.0
homepage: https://github.com/vishaaalls/rapid_archive
repository: https://github.com/vishaaalls/rapid_archive/tree/main/packages/rapid_archive
issue_tracker: https://github.com/vishaaalls/rapid_archive/issues
topics: [compression, zip, gzip, ffi, rust]
environment:
  sdk: ^3.6.0
dependencies:
  archive: ^4.0.0
  code_assets: ^2.2.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: ^2.2.0
dev_dependencies:
  test: any

# When this package is the root (its own tests, benchmarks), build the Rust
# code in this checkout instead of downloading a release binary.
hooks:
  user_defines:
    rapid_archive:
      from_source: true
