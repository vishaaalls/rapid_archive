# WebAssembly build: bulk-memory makes memcpy/memset single instructions,
# simd128 lets LLVM vectorize. Supported by every current browser.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+bulk-memory,+simd128"]

[env]
CFLAGS_wasm32_unknown_unknown = "-mbulk-memory -msimd128 -O3"
CC_wasm32_unknown_unknown = "clang"
AR_wasm32_unknown_unknown = "llvm-ar"
