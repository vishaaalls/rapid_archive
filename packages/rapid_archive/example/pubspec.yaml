name: rapid_archive_example
description: On-device benchmark of rapid_archive vs archive.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  rapid_archive:
    path: ..

flutter:
  uses-material-design: true

# The example tests the code in this checkout, so build Rust from source.
hooks:
  user_defines:
    rapid_archive:
      from_source: true
